services:
  - type: web
    name: wingo-db-gateway
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RENDER_ENV
        value: "production"
    # Free tier optimizations
    healthCheckPath: "/healthz"
    autoDeploy: false  # Prevent unnecessary rebuilds
