name: 24/7 WinGo AI Worker
on:
  schedule:
    # Trigger every 4 hours to ensure an active runner is always running 24/7
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scrape-and-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 24/7 Continuous Background AI Worker
        env:
          DATABASE_URL: "postgresql://postgres:rodrE0%2Dfyvnov%2Dgyvzuz@db.zyryxnifpduwsulglhdq.supabase.co:5432/postgres"
        run: |
          python backend/scraper.py
